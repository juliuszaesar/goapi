version: "3.8"

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: goapi
      POSTGRES_PASSWORD: password
      POSTGRES_DB: goapi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  typesense:
    image: typesense/typesense:26.0
    restart: always
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data
    command: '--data-dir /data --api-key=xyz --enable-cors'
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - app-network

  app:
    build: .
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: goapi
      DB_PASSWORD: password
      DB_NAME: goapi
      DB_PORT: 5432
      DB_SSLMODE: disable
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_API_KEY: xyz
      SERVER_PORT: 3000
    depends_on:
      - db
      - typesense
    networks:
      - app-network

volumes:
  postgres_data:
  typesense_data:

networks:
  app-network:

