<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reminder App</title>
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      color: white;
    }

    .header h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 10px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .header p {
      font-size: 1.2rem;
      opacity: 0.9;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-bottom: 40px;
    }

    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .card h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #2d3748;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #4a5568;
    }

    .input-wrapper {
      position: relative;
    }

    input, textarea {
      width: 100%;
      padding: 15px 20px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 16px;
      transition: all 0.3s ease;
      background: white;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      transform: translateY(-2px);
    }

    .search-input {
      padding-left: 50px;
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #a0aec0;
      font-size: 18px;
    }

    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #4a5568;
    }

    .btn-secondary:hover {
      background: #cbd5e0;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .reminders-section {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .section-header h2 {
      font-size: 1.8rem;
      color: #2d3748;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .reminder-item {
      background: white;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      border: 1px solid #f7fafc;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .reminder-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 4px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .reminder-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .reminder-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 15px;
    }

    .reminder-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 5px;
    }

    .reminder-date {
      font-size: 0.85rem;
      color: #a0aec0;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .reminder-content {
      color: #4a5568;
      line-height: 1.6;
      font-size: 1rem;
    }

    .reminder-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-small {
      padding: 8px 16px;
      font-size: 14px;
      border-radius: 8px;
    }

    .btn-danger {
      background: #e53e3e;
    }

    .btn-danger:hover {
      background: #c53030;
      box-shadow: 0 5px 15px rgba(229, 62, 62, 0.3);
    }

    .search-results {
      margin-top: 20px;
    }

    .search-results h3 {
      color: #4a5568;
      margin-bottom: 15px;
      font-size: 1.1rem;
    }

    .no-results {
      text-align: center;
      color: #a0aec0;
      font-style: italic;
      padding: 40px;
      background: #f7fafc;
      border-radius: 12px;
      margin: 20px 0;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: #a0aec0;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #e2e8f0;
      border-top: 2px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .fade-in {
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .search-highlight {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1><i class="fas fa-sticky-note"></i> Reminder App</h1>
      <p>Organize your thoughts and never forget important tasks</p>
    </div>

    <!-- Main Grid -->
    <div class="main-grid">
      <!-- Search Section -->
      <div class="card">
        <h2><i class="fas fa-search"></i> Search Reminders</h2>
        <div class="form-group">
          <div class="input-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input
              type="text"
              id="searchQuery"
              name="query"
              class="search-input"
              placeholder="Search your reminders..."
              hx-get="/search"
              hx-target="#searchResults"
              hx-trigger="keyup changed delay:300ms"
              hx-indicator="#search-spinner"
            >
          </div>
        </div>
        <div class="search-results">
          <div id="search-spinner" class="loading htmx-indicator">
            <div class="spinner"></div>
            Searching...
          </div>
          <div id="searchResults"></div>
        </div>
      </div>

      <!-- Add Reminder Form -->
      <div class="card">
        <h2><i class="fas fa-plus-circle"></i> Add New Reminder</h2>
        <form hx-post="/reminders" hx-target="#remindersList" hx-swap="afterbegin" hx-on::after-request="this.reset(); htmx.trigger('#remindersList', 'refresh')">
          <div class="form-group">
            <label for="title"><i class="fas fa-heading"></i> Title</label>
            <input type="text" id="title" name="title" placeholder="Enter reminder title..." required>
          </div>
          <div class="form-group">
            <label for="content"><i class="fas fa-align-left"></i> Content</label>
            <textarea id="content" name="content" rows="4" placeholder="Add details about your reminder..."></textarea>
          </div>
          <button type="submit" class="btn">
            <i class="fas fa-plus"></i> Add Reminder
          </button>
        </form>
      </div>
    </div>

    <!-- Reminders Section -->
    <div class="reminders-section">
      <div class="section-header">
        <h2><i class="fas fa-list"></i> Your Reminders</h2>
        <button class="btn btn-secondary" onclick="refreshReminders()">
          <i class="fas fa-sync-alt"></i> Refresh
        </button>
      </div>
      <div id="remindersList" hx-get="/reminders" hx-trigger="load, refresh from:body">
        <div class="loading">
          <div class="spinner"></div>
          Loading your reminders...
        </div>
      </div>
    </div>
  </div>

  <script>
    function clearSearch() {
      document.getElementById('searchQuery').value = '';
      document.getElementById('searchResults').innerHTML = '';
    }

    function refreshReminders() {
      htmx.trigger('#remindersList', 'refresh');
    }

    function deleteReminder(id) {
      if (confirm('Are you sure you want to delete this reminder?')) {
        fetch(`/reminders/${id}`, { method: 'DELETE' })
          .then(() => refreshReminders())
          .catch(err => console.error('Error deleting reminder:', err));
      }
    }

    // Auto-refresh reminders list after adding a new one
    document.body.addEventListener('htmx:afterRequest', function(evt) {
      if (evt.detail.xhr.status === 201 && evt.detail.requestConfig.verb === 'post') {
        // Add fade-in animation to new items
        setTimeout(() => {
          const newItems = document.querySelectorAll('.reminder-item:not(.fade-in)');
          newItems.forEach(item => item.classList.add('fade-in'));
        }, 100);
      }
    });

    // Clear search when input is empty
    document.getElementById('searchQuery').addEventListener('input', function(e) {
      if (e.target.value === '') {
        document.getElementById('searchResults').innerHTML = '';
      }
    });
  </script>
</body>

</html>
